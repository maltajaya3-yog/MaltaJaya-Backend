services:
  db:
    image: postgres:16-alpine
    container_name: maltajaya-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maltajaya}
      POSTGRES_USER: ${POSTGRES_USER:-maltajaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
    ports:
      # Hanya bisa diakses dari komputer ini.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dijalankan otomatis saat volume database masih kosong (pertama kali / setelah db:reset).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
